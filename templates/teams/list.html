{% extends 'base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1>Teams</h1>
    {% for team in teams %}
        <div style="border: 2px solid gray; margin-bottom: 10px; padding-inline: 10px">
            <h2>{{ team.name }}</h2>
            <p>{{ team.description }}</p>
        </div>
    {% endfor %}
{% endblock %}
