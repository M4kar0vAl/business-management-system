{% extends 'base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1>Add user to team</h1>
    <form action="{{ url_for('add_team_member', team_id=team.id) }}" method="post">
        <p>
            <label for="user_email">Email:</label>
            <input id="user_email" type="email" name="user_email" value="{{ user_email if user_email is defined else '' }}" required />
        </p>
        <button type="submit">Add user to team</button>
    </form>
    {% if error is defined %}
        <p style="color: red">{{ error }}</p>
    {% endif %}
{% endblock %}
