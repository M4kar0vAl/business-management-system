{% extends 'base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1>Create Team</h1>
    <form action="{{ url_for('create_team') }}" method="post">
        <p>
            <label for="team_name">Name:</label>
            <input id="team_name" type="text" name="name" value="{{ team_data.name if team_data is defined else '' }}" required />
        </p>
        <p>
            <label for="team_description">Description:</label>
            <textarea id="team_description" name="description" >{{ team_data.description if team_data is defined else '' }}</textarea>
        </p>
        <button type="submit">Create</button>
    </form>
    {% if error is defined %}
        <p style="color: red">{{ error }}</p>
    {% endif %}
{% endblock %}
