{% extends 'base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1>Create Task</h1>
    <form id="task_create_form" action="{{ url_for('create_task') }}" method="post">
        <p>
            <label for="task_description">Description:</label>
            <textarea
                id="task_description"
                name="description"
                required
            >{{ task_data.description if task_data is defined else '' }}</textarea>
        </p>
        <p>
            <label for="task_deadline">Deadline:</label>
            <input
                id="task_deadline"
                type="datetime-local"
                name="deadline"
                value="{{ task_data.deadline if task_data is defined else '' }}"
                required
            />
            <input
                id="user_timezone"
                type="hidden"
                name="user_timezone"
            />
        </p>
        <input
            id="team_id"
            type="hidden"
            name="team_id"
            value="{{ team_id }}"
        />
        <button type="submit">Create</button>
    </form>
    {% if error is defined %}
        <p style="color: red">{{ error }}</p>
    {% endif %}
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('task_create_form');

    form.addEventListener('submit', (event) => {
        // Получаем IANA-название часового пояса пользователя, например "Europe/Moscow"
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // Находим скрытое поле и записываем в него полученное значение
        const hiddenTzInput = document.getElementById('user_timezone');

        if (hiddenTzInput) {
            hiddenTzInput.value = timezone;
        }
    });
</script>
{% endblock %}
